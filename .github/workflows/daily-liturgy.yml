name: Refresh daily liturgy links

on:
  schedule:
    # After midnight in America/Chicago, with a second pass for feed delays.
    - cron: '35 7 * * *'
    - cron: '35 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read USCCB RSS metadata
        run: python scripts/update_daily_liturgy.py
      - name: Commit changed index
        run: |
          git add liturgy/days.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh USCCB daily reading links'
          git push
